<section class="admin-panel rounded-lg overflow-hidden">
    <div class="border-b border-white/6 px-4 py-3.5">
        <h3 class="font-display text-xl font-semibold text-white">Historical Logs</h3>
        <p class="mt-1 text-sm text-slate-400">Filter persisted log entries by time window and severity before previewing or downloading.</p>
    </div>

    <div class="space-y-4 p-4">
        <div class="grid gap-4 xl:grid-cols-[minmax(0,1fr)_auto] xl:items-end">
            <div class="grid gap-4 lg:grid-cols-3">
                <div>
                    <label class="mb-2 block text-sm font-semibold text-slate-300">Time Range</label>
                    <select id="time-preset" onchange="applyPreset()" class="admin-select">
                        <option value="1h">Last 1 hour</option>
                        <option value="6h">Last 6 hours</option>
                        <option value="24h" selected>Last 24 hours</option>
                        <option value="7d">Last 7 days</option>
                        <option value="custom">Custom range</option>
                    </select>
                </div>
                <div id="start-time-container" class="hidden">
                    <label class="mb-2 block text-sm font-semibold text-slate-300">Start Time</label>
                    <input type="datetime-local" id="start-time" class="admin-input">
                </div>
                <div id="end-time-container" class="hidden">
                    <label class="mb-2 block text-sm font-semibold text-slate-300">End Time</label>
                    <input type="datetime-local" id="end-time" class="admin-input">
                </div>
            </div>

            <div class="flex flex-wrap gap-2">
                <button onclick="loadLogs()" class="admin-button border-sky-400/25 bg-sky-400/10 text-sky-100">
                    Query Logs
                </button>
                <button onclick="downloadLogs('log')" class="admin-button">
                    Download .log
                </button>
                <button onclick="downloadLogs('json')" class="admin-button">
                    Download .json
                </button>
            </div>
        </div>

        <div>
            <label class="mb-3 block text-sm font-semibold text-slate-300">Log Levels</label>
            <div class="flex flex-wrap gap-2">
                <label class="inline-flex items-center gap-2 rounded-full border border-white/8 bg-white/5 px-4 py-2 text-sm text-slate-300">
                    <input type="checkbox" value="DEBUG" class="level-filter rounded border-white/20 bg-slate-950 text-sky-500">
                    DEBUG
                </label>
                <label class="inline-flex items-center gap-2 rounded-full border border-white/8 bg-white/5 px-4 py-2 text-sm text-slate-300">
                    <input type="checkbox" value="INFO" class="level-filter rounded border-white/20 bg-slate-950 text-sky-500" checked>
                    INFO
                </label>
                <label class="inline-flex items-center gap-2 rounded-full border border-white/8 bg-white/5 px-4 py-2 text-sm text-slate-300">
                    <input type="checkbox" value="WARNING" class="level-filter rounded border-white/20 bg-slate-950 text-sky-500" checked>
                    WARNING
                </label>
                <label class="inline-flex items-center gap-2 rounded-full border border-white/8 bg-white/5 px-4 py-2 text-sm text-slate-300">
                    <input type="checkbox" value="ERROR" class="level-filter rounded border-white/20 bg-slate-950 text-sky-500" checked>
                    ERROR
                </label>
                <label class="inline-flex items-center gap-2 rounded-full border border-white/8 bg-white/5 px-4 py-2 text-sm text-slate-300">
                    <input type="checkbox" value="CRITICAL" class="level-filter rounded border-white/20 bg-slate-950 text-sky-500" checked>
                    CRITICAL
                </label>
            </div>
        </div>

        <div class="admin-console-frame overflow-hidden rounded-lg">
            <div id="logs-table-container">
                <div class="px-5 py-12 text-center text-sm text-slate-500">
                    Click Query Logs to load matching entries.
                </div>
            </div>
        </div>
    </div>
</section>

<script>
function applyPreset() {
    const preset = document.getElementById('time-preset').value;
    const startContainer = document.getElementById('start-time-container');
    const endContainer = document.getElementById('end-time-container');

    if (preset === 'custom') {
        startContainer.classList.remove('hidden');
        endContainer.classList.remove('hidden');
    } else {
        startContainer.classList.add('hidden');
        endContainer.classList.add('hidden');
    }
}

function getTimeRange() {
    const preset = document.getElementById('time-preset').value;
    const now = new Date();
    let start, end;

    if (preset === 'custom') {
        start = document.getElementById('start-time').value;
        end = document.getElementById('end-time').value;
        if (start) start = new Date(start).toISOString();
        if (end) end = new Date(end).toISOString();
    } else {
        end = now.toISOString();
        const hours = preset === '1h' ? 1 : preset === '6h' ? 6 : preset === '24h' ? 24 : 168;
        start = new Date(now - hours * 3600000).toISOString();
    }
    return { start, end };
}

function getSelectedLevels() {
    const checkboxes = document.querySelectorAll('.level-filter:checked');
    return Array.from(checkboxes).map(cb => cb.value).join(',');
}

function loadLogs() {
    const { start, end } = getTimeRange();
    const levels = getSelectedLevels();
    const params = new URLSearchParams();
    if (start) params.append('start', start);
    if (end) params.append('end', end);
    if (levels) params.append('levels', levels);

    const container = document.getElementById('logs-table-container');
    container.innerHTML = '<div class="px-5 py-12 text-center text-sm text-slate-500">Loading logs...</div>';

    fetch(`/admin/api/logs?${params.toString()}`)
        .then(response => response.json())
        .then(data => {
            renderLogsTable(data);
        })
        .catch(err => {
            container.innerHTML = '<div class="px-5 py-12 text-center text-sm text-red-300">Failed to load logs: ' + escapeHtml(err.message) + '</div>';
        });
}

function renderLogsTable(data) {
    const container = document.getElementById('logs-table-container');

    if (!data.items || data.items.length === 0) {
        container.innerHTML = '<div class="px-5 py-12 text-center text-sm text-slate-500">No matching log entries found.</div>';
        return;
    }

    let html = `
        <div class="overflow-x-auto">
            <table class="admin-table admin-table-dense">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Level</th>
                        <th>Request ID</th>
                        <th>Message</th>
                    </tr>
                </thead>
                <tbody>
    `;

    data.items.forEach(item => {
        const levelClass = {
            'DEBUG': 'admin-badge-neutral',
            'INFO': 'admin-badge-neutral',
            'WARNING': 'admin-badge-warning',
            'ERROR': 'admin-badge-danger',
            'CRITICAL': 'admin-badge-danger'
        }[item.level] || 'admin-badge-neutral';

        const time = new Date(item.timestamp).toLocaleString(undefined, { hour12: false });
        html += `
            <tr>
                <td class="whitespace-nowrap text-slate-300">${time}</td>
                <td class="whitespace-nowrap">
                    <span class="admin-badge ${levelClass}">${item.level}</span>
                </td>
                <td class="whitespace-nowrap font-mono text-sm text-slate-400">${escapeHtml(item.request_id)}</td>
                <td class="text-slate-300">${escapeHtml(item.message)}</td>
            </tr>
        `;
    });

    html += `
                </tbody>
            </table>
        </div>
        <div class="border-t border-white/6 px-5 py-4 text-sm text-slate-400">
            Showing ${data.filtered} entries from ${data.total}
            ${data.has_more ? '<span class="text-slate-500">with more available</span>' : ''}
        </div>
    `;

    container.innerHTML = html;
}

function downloadLogs(format) {
    const { start, end } = getTimeRange();
    const levels = getSelectedLevels();
    const params = new URLSearchParams();
    if (start) params.append('start', start);
    if (end) params.append('end', end);
    if (levels) params.append('levels', levels);
    params.append('format', format);

    window.location.href = `/admin/api/logs/download?${params.toString()}`;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
