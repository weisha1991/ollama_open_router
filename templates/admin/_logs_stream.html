<section class="admin-panel rounded-lg overflow-hidden">
    <div class="border-b border-white/6 px-4 py-3.5">
        <h3 class="font-display text-xl font-semibold text-white">Realtime Logs</h3>
        <p class="mt-1 text-sm text-slate-400">Open a live stream to observe incoming router events as they happen.</p>
    </div>

    <div class="space-y-4 p-4">
        <div class="admin-panel-soft rounded-lg p-4">
            <div class="grid gap-5 xl:grid-cols-[minmax(0,1fr)_auto] xl:items-end">
                <div>
                    <label class="mb-3 block text-sm font-semibold text-slate-300">Stream Levels</label>
                    <div class="flex flex-wrap gap-2">
                        <label class="inline-flex items-center gap-2 rounded-full border border-white/8 bg-white/5 px-4 py-2 text-sm text-slate-300">
                            <input type="checkbox" value="DEBUG" class="stream-level-filter rounded border-white/20 bg-slate-950 text-sky-500">
                            DEBUG
                        </label>
                        <label class="inline-flex items-center gap-2 rounded-full border border-white/8 bg-white/5 px-4 py-2 text-sm text-slate-300">
                            <input type="checkbox" value="INFO" class="stream-level-filter rounded border-white/20 bg-slate-950 text-sky-500" checked>
                            INFO
                        </label>
                        <label class="inline-flex items-center gap-2 rounded-full border border-white/8 bg-white/5 px-4 py-2 text-sm text-slate-300">
                            <input type="checkbox" value="WARNING" class="stream-level-filter rounded border-white/20 bg-slate-950 text-sky-500" checked>
                            WARNING
                        </label>
                        <label class="inline-flex items-center gap-2 rounded-full border border-white/8 bg-white/5 px-4 py-2 text-sm text-slate-300">
                            <input type="checkbox" value="ERROR" class="stream-level-filter rounded border-white/20 bg-slate-950 text-sky-500" checked>
                            ERROR
                        </label>
                        <label class="inline-flex items-center gap-2 rounded-full border border-white/8 bg-white/5 px-4 py-2 text-sm text-slate-300">
                            <input type="checkbox" value="CRITICAL" class="stream-level-filter rounded border-white/20 bg-slate-950 text-sky-500" checked>
                            CRITICAL
                        </label>
                    </div>
                </div>

                <div class="flex flex-wrap items-center gap-2">
                    <label class="inline-flex items-center gap-2 rounded-full border border-white/8 bg-white/5 px-4 py-2 text-sm text-slate-300">
                        <input type="checkbox" id="auto-scroll" class="rounded border-white/20 bg-slate-950 text-sky-500" checked>
                        Auto-scroll
                    </label>
                    <button id="pause-btn" onclick="togglePause()" class="admin-button border-amber-400/20 text-amber-200">
                        Pause
                    </button>
                    <button onclick="clearLogs()" class="admin-button border-rose-400/20 text-rose-200">
                        Clear
                    </button>
                </div>
            </div>
        </div>

        <div class="admin-console-frame overflow-hidden rounded-lg bg-[#050914] shadow-inner shadow-black/40">
            <div class="flex items-center justify-between border-b border-white/6 bg-white/[0.03] px-5 py-3">
                <div class="flex items-center gap-2">
                    <span class="h-3 w-3 rounded-full bg-rose-400"></span>
                    <span class="h-3 w-3 rounded-full bg-amber-400"></span>
                    <span class="h-3 w-3 rounded-full bg-emerald-400"></span>
                </div>
                <p class="font-mono text-xs text-slate-500">/admin/api/logs/stream</p>
            </div>
            <div id="log-stream-container" class="h-[30rem] overflow-y-auto p-4 font-mono text-sm leading-6">
                <div class="py-12 text-center text-sm text-slate-500">
                    Click Realtime Logs to open the stream. Recent entries will appear here.
                </div>
            </div>
        </div>
    </div>
</section>

<script>
let eventSource = null;
let isPaused = false;
let maxLogs = 500;

function getStreamLevels() {
    const checkboxes = document.querySelectorAll('.stream-level-filter:checked');
    return Array.from(checkboxes).map(cb => cb.value).join(',');
}

function startLogStream() {
    if (eventSource) {
        eventSource.close();
    }

    const levels = getStreamLevels();
    const params = levels ? `?levels=${levels}` : '';
    eventSource = new EventSource(`/admin/api/logs/stream${params}`);

    const container = document.getElementById('log-stream-container');
    container.innerHTML = '<div class="py-12 text-center text-sm text-slate-500">Waiting for logs...</div>';

    eventSource.addEventListener('log', function(e) {
        if (isPaused) return;
        try {
            const log = JSON.parse(e.data);
            addLogEntry(log);
        } catch (err) {
            console.error('Failed to parse log:', err);
        }
    });

    eventSource.addEventListener('ping', function() {
        // Heartbeat received.
    });

    eventSource.addEventListener('error', function(e) {
        console.error('SSE error:', e);
        if (e.data) {
            try {
                const error = JSON.parse(e.data);
                addLogEntry({
                    timestamp: new Date().toISOString(),
                    level: 'ERROR',
                    request_id: 'system',
                    message: `Stream error: ${error.error}`
                });
            } catch (err) {
                // Ignore malformed error payloads from the stream.
            }
        }
    });

    eventSource.onerror = function(e) {
        console.error('EventSource error:', e);
        if (eventSource.readyState === EventSource.CLOSED) {
            addLogEntry({
                timestamp: new Date().toISOString(),
                level: 'ERROR',
                request_id: 'system',
                message: 'Connection closed. Select Realtime Logs to reconnect.'
            });
        }
    };
}

function stopLogStream() {
    if (eventSource) {
        eventSource.close();
        eventSource = null;
    }
}

function addLogEntry(log) {
    const container = document.getElementById('log-stream-container');
    const placeholder = container.querySelector('.text-center');
    if (placeholder && (placeholder.textContent.includes('Waiting') || placeholder.textContent.includes('Click'))) {
        placeholder.remove();
    }

    const entry = document.createElement('div');
    entry.className = 'grid gap-3 border-b border-white/5 py-2 text-slate-300 md:grid-cols-[86px_82px_136px_minmax(0,1fr)]';

    const levelColors = {
        'DEBUG': 'text-slate-500',
        'INFO': 'text-sky-300',
        'WARNING': 'text-amber-300',
        'ERROR': 'text-rose-300',
        'CRITICAL': 'text-rose-200 font-bold'
    };

    const time = new Date(log.timestamp).toLocaleTimeString(undefined, { hour12: false });
    entry.innerHTML = `
        <span class="text-slate-600">${time}</span>
        <span class="${levelColors[log.level] || 'text-slate-300'}">${log.level}</span>
        <span class="truncate text-slate-600">[${escapeHtml(log.request_id)}]</span>
        <span class="min-w-0 break-words text-slate-300">${escapeHtml(log.message)}</span>
    `;

    container.appendChild(entry);

    while (container.children.length > maxLogs) {
        container.removeChild(container.firstChild);
    }

    if (document.getElementById('auto-scroll').checked) {
        container.scrollTop = container.scrollHeight;
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function togglePause() {
    isPaused = !isPaused;
    const btn = document.getElementById('pause-btn');
    btn.textContent = isPaused ? 'Resume' : 'Pause';
    btn.className = isPaused
        ? 'admin-button border-emerald-400/20 text-emerald-200'
        : 'admin-button border-amber-400/20 text-amber-200';
}

function clearLogs() {
    const container = document.getElementById('log-stream-container');
    container.innerHTML = `
        <div class="py-12 text-center text-sm text-slate-500">
            Log stream cleared.
        </div>
    `;
}

document.querySelectorAll('.stream-level-filter').forEach(cb => {
    cb.addEventListener('change', function() {
        if (document.getElementById('content-realtime').classList.contains('hidden') === false) {
            startLogStream();
        }
    });
});
</script>
